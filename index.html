<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - 春晓寒冬</title>
    <!-- 引入你的通用样式表 -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* 隐藏页面滚动条，让落地页纯粹占据整个屏幕 */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 落地页全屏背景 */
        .landing-container {
            position: relative;
            height: 100vh;
            width: 100%;
            /* 这里使用你的海景图，如果没有可以先放个颜色：background-color: #1a1a1a; */
            background-image: url('pic2.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 深色遮罩，增加高级感和文字清晰度 */
        .landing-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); 
            z-index: 1;
            transition: background 0.5s ease;
        }

        /* 鼠标悬停在背景上时，遮罩稍微变亮 */
        .landing-container:hover::before {
            background: rgba(0, 0, 0, 0.3); 
        }

        /* 居中文字区域 */
        .landing-content {
            position: relative;
            z-index: 2;
            color: #ffffff;
            padding: 0 20px;
            animation: fadeIn 2s ease-in-out; /* 淡入动画 */
        }

        .landing-content h1 {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 6px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .landing-content p {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #e0e0e0;
            margin-bottom: 50px;
        }

        /* 进入网站的按钮 */
        .enter-btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 16px;
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #ffffff;
            border-radius: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px); /* 背景模糊效果 */
        }

        .enter-btn:hover {
            background-color: #ffffff;
            color: #000000;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        /* 简单的文字淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 手机屏幕适配 */
        @media (max-width: 600px) {
            .landing-content h1 { font-size: 42px; letter-spacing: 4px; }
            .landing-content p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- 全屏落地页容器 -->
    <div class="landing-container">
        <div class="landing-content">
            <h1>春晓寒冬</h1>
            <p>Computer Science at BiUH — a website written entirely by hand.</p>
            
            <!-- 点击进入按钮，指向你真正的首页 home.html -->
            <a href="home.html" class="enter-btn">Enter Site</a>
        </div>
    </div>

</body>
</html>
